<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8b8b95" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#0e0e10"/>
  <g stroke="#1c1c21" stroke-width="1">
    <path d="M0 130H1200M0 260H1200M0 390H1200"/>
    <path d="M240 0V520M480 0V520M720 0V520M960 0V520"/>
  </g>

  <text x="60" y="56" fill="#f4f4f5" font-size="22" font-weight="600">Nothing is on the element — everything is a relationship</text>

  <!-- wall -->
  <rect x="80" y="210" width="200" height="76" rx="12" fill="#161619" stroke="#84cc16"/>
  <text x="180" y="243" fill="#f4f4f5" font-size="16" font-weight="600" text-anchor="middle">IfcWall</text>
  <text x="180" y="266" fill="#8b8b95" font-size="12">GlobalId: 2O2Fr$t4X…</text>

  <!-- relationships column -->
  <rect x="440" y="100" width="280" height="64" rx="12" fill="#161619" stroke="#2c2c33"/>
  <text x="580" y="128" fill="#f4f4f5" font-size="14" font-weight="600" text-anchor="middle">IfcRelDefinesByProperties</text>
  <text x="580" y="148" fill="#8b8b95" font-size="12" text-anchor="middle">links element → property set</text>

  <rect x="440" y="216" width="280" height="64" rx="12" fill="#161619" stroke="#2c2c33"/>
  <text x="580" y="244" fill="#f4f4f5" font-size="14" font-weight="600" text-anchor="middle">IfcRelContainedInSpatialStructure</text>
  <text x="580" y="264" fill="#8b8b95" font-size="12" text-anchor="middle">links element → storey</text>

  <rect x="440" y="332" width="280" height="64" rx="12" fill="#161619" stroke="#2c2c33"/>
  <text x="580" y="360" fill="#f4f4f5" font-size="14" font-weight="600" text-anchor="middle">IfcRelAssociatesMaterial</text>
  <text x="580" y="380" fill="#8b8b95" font-size="12" text-anchor="middle">links element → material layers</text>

  <!-- targets column -->
  <rect x="880" y="100" width="250" height="64" rx="12" fill="#1a1625" stroke="#8b5cf6"/>
  <text x="1005" y="128" fill="#f4f4f5" font-size="14" font-weight="600" text-anchor="middle">IfcPropertySet</text>
  <text x="1005" y="148" fill="#a78bfa" font-size="12" text-anchor="middle">FireRating · IsExternal · …</text>

  <rect x="880" y="216" width="250" height="64" rx="12" fill="#161619" stroke="#2c2c33"/>
  <text x="1005" y="244" fill="#f4f4f5" font-size="14" font-weight="600" text-anchor="middle">IfcBuildingStorey</text>
  <text x="1005" y="264" fill="#8b8b95" font-size="12" text-anchor="middle">site → building → storey</text>

  <rect x="880" y="332" width="250" height="64" rx="12" fill="#161619" stroke="#2c2c33"/>
  <text x="1005" y="360" fill="#f4f4f5" font-size="14" font-weight="600" text-anchor="middle">IfcMaterialLayerSet</text>
  <text x="1005" y="380" fill="#8b8b95" font-size="12" text-anchor="middle">concrete 200 · insulation 80</text>

  <!-- edges -->
  <g stroke="#8b8b95" stroke-width="1.6" fill="none">
    <path d="M280 232 C 360 210 380 150 438 136" marker-end="url(#a)"/>
    <path d="M280 248 L 438 248" marker-end="url(#a)"/>
    <path d="M280 264 C 360 290 380 350 438 362" marker-end="url(#a)"/>
    <path d="M720 132 L 878 132" marker-end="url(#a)"/>
    <path d="M720 248 L 878 248" marker-end="url(#a)"/>
    <path d="M720 364 L 878 364" marker-end="url(#a)"/>
  </g>

  <text x="60" y="480" fill="#6b6b74" font-size="13">the quantities live in a fourth relation (IfcElementQuantity) — read those before measuring geometry yourself</text>
</svg>
