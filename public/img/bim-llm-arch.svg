<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8b8b95" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#0e0e10"/>
  <g stroke="#1c1c21" stroke-width="1">
    <path d="M0 140H1200M0 280H1200M0 420H1200"/>
    <path d="M300 0V560M600 0V560M900 0V560"/>
  </g>

  <text x="60" y="56" fill="#f4f4f5" font-size="22" font-weight="600">bim-llm — numbers never come from the language model</text>

  <!-- deterministic lane -->
  <rect x="60" y="110" width="1080" height="120" rx="14" fill="none" stroke="#84cc16" stroke-dasharray="6 5" opacity="0.6"/>
  <text x="80" y="138" fill="#84cc16" font-size="12" font-weight="600">DETERMINISTIC</text>

  <rect x="100" y="152" width="220" height="60" rx="12" fill="#161619" stroke="#2c2c33"/>
  <text x="210" y="178" fill="#f4f4f5" font-size="15" font-weight="600" text-anchor="middle">IFC model</text>
  <text x="210" y="198" fill="#8b8b95" font-size="12" text-anchor="middle">walls, slabs, psets</text>

  <rect x="460" y="152" width="260" height="60" rx="12" fill="#161619" stroke="#2c2c33"/>
  <text x="590" y="178" fill="#f4f4f5" font-size="15" font-weight="600" text-anchor="middle">IfcOpenShell extraction</text>
  <text x="590" y="198" fill="#8b8b95" font-size="12" text-anchor="middle">IfcElementQuantity → m³, m², counts</text>

  <rect x="860" y="152" width="240" height="60" rx="12" fill="#161619" stroke="#2c2c33"/>
  <text x="980" y="178" fill="#f4f4f5" font-size="15" font-weight="600" text-anchor="middle">Validated quantities</text>
  <text x="980" y="198" fill="#8b8b95" font-size="12" text-anchor="middle">units normalized, flagged</text>

  <!-- probabilistic lane -->
  <rect x="60" y="300" width="1080" height="120" rx="14" fill="none" stroke="#8b5cf6" stroke-dasharray="6 5" opacity="0.6"/>
  <text x="80" y="328" fill="#a78bfa" font-size="12" font-weight="600">PROBABILISTIC</text>

  <rect x="100" y="342" width="220" height="60" rx="12" fill="#1a1625" stroke="#8b5cf6"/>
  <text x="210" y="368" fill="#f4f4f5" font-size="15" font-weight="600" text-anchor="middle">RAG over standards</text>
  <text x="210" y="388" fill="#a78bfa" font-size="12" text-anchor="middle">NRM2 · MasterFormat in ChromaDB</text>

  <rect x="460" y="342" width="260" height="60" rx="12" fill="#1a1625" stroke="#8b5cf6"/>
  <text x="590" y="368" fill="#f4f4f5" font-size="15" font-weight="600" text-anchor="middle">Classifier agents</text>
  <text x="590" y="388" fill="#a78bfa" font-size="12" text-anchor="middle">structured output + confidence</text>

  <rect x="860" y="342" width="240" height="60" rx="12" fill="#161619" stroke="#2c2c33"/>
  <text x="980" y="368" fill="#f4f4f5" font-size="15" font-weight="600" text-anchor="middle">Work-item mapping</text>
  <text x="980" y="388" fill="#8b8b95" font-size="12" text-anchor="middle">with cited clause text</text>

  <!-- outputs -->
  <rect x="330" y="470" width="240" height="60" rx="12" fill="#141a10" stroke="#84cc16"/>
  <text x="450" y="496" fill="#f4f4f5" font-size="15" font-weight="600" text-anchor="middle">BOQ</text>
  <text x="450" y="516" fill="#a3c76d" font-size="12" text-anchor="middle">confidence ≥ 0.7</text>

  <rect x="640" y="470" width="260" height="60" rx="12" fill="#1c1512" stroke="#f59e0b"/>
  <text x="770" y="496" fill="#f4f4f5" font-size="15" font-weight="600" text-anchor="middle">Human review queue</text>
  <text x="770" y="516" fill="#d9a75f" font-size="12" text-anchor="middle">confidence &lt; 0.7, with evidence</text>

  <g stroke="#8b8b95" stroke-width="1.6" fill="none">
    <path d="M320 182 L 458 182" marker-end="url(#b)"/>
    <path d="M720 182 L 858 182" marker-end="url(#b)"/>
    <path d="M320 372 L 458 372" marker-end="url(#b)"/>
    <path d="M720 372 L 858 372" marker-end="url(#b)"/>
    <path d="M980 212 C 980 260 780 300 720 340" opacity="0.7" marker-end="url(#b)"/>
    <path d="M900 402 C 850 430 600 440 520 468" marker-end="url(#b)"/>
    <path d="M950 402 C 920 430 830 440 800 468" marker-end="url(#b)"/>
  </g>
</svg>
